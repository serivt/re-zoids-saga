[package]
name = "launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
localization.workspace = true
formats.workspace = true
game-core.workspace = true
gba-runtime.workspace = true
platform.workspace = true
extraction.workspace = true
platform-sdl3.workspace = true
screen-filters.workspace = true
game-saga.workspace = true
game-legacy.workspace = true
game-fuzors.workspace = true
anyhow = "1.0.104"
ureq = "3.4.2"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }

[features]
packaged = ["platform-sdl3/static-sdl"]
# F10 turns the game's debugging mode on and off; never in the packages
# players download.
debug-mode = []

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.31"
