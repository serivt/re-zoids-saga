// The Android app's project: the app module wraps SDL's Java activity and the
// native libraries the Rust build leaves in app/src/main/jniLibs (see
// tools/package/android.sh).

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
