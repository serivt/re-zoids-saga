# Builds the packages players download, for macOS, Windows, Linux, Android
# and web browsers, with the scripts in tools/package, each with a .sha256
# file holding its SHA-256 checksum. A release also publishes the web
# version's site on Cloudflare (services/site) when the CLOUDFLARE_API_TOKEN
# secret and the CLOUDFLARE_ACCOUNT_ID variable are set, with the cloud
# saves when the SUPABASE_URL and SUPABASE_ANON_KEY variables are, and
# counting its visits when CLOUDFLARE_ANALYTICS_TOKEN is. The Android app is signed with the keystore in the
# ANDROID_KEYSTORE_BASE64 secret (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD), which a release needs; without it a run by hand
# builds it with the debug key. It is then started on an emulator, without a
# ROM, to check that it shows the launcher. Publishing a GitHub release (its tag, title, notes and prerelease
# mark written by hand) builds them from the release's tag and attaches them
# to it; running the workflow by hand only keeps them as the run's artifacts.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install SDL3's build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev

      - name: Add the Intel target
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tools/package/macos.sh "$VERSION"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tools/package/linux.sh "$VERSION"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/package/windows.ps1 $env:VERSION

      - name: Checksum
        shell: bash
        working-directory: dist
        run: |
          for package in *.dmg *.zip *.tar.gz; do
            [[ -e "$package" ]] || continue
            if command -v sha256sum > /dev/null; then
              sha256sum "$package" > "$package.sha256"
            else
              shasum -a 256 "$package" > "$package.sha256"
            fi
            cat "$package.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  android:
    name: Package (Android)
    runs-on: ubuntu-24.04
    env:
      ABIS: arm64-v8a x86_64
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install the NDK and the Android targets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - uses: Swatinem/rust-cache@v2
        with:
          key: Android

      - name: Keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            base64 --decode <<< "$KEYSTORE" > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD=release" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" == release ]]; then
            echo "::error::a release needs the ANDROID_KEYSTORE_BASE64 secret"
            exit 1
          else
            echo "BUILD=debug" >> "$GITHUB_ENV"
          fi

      - name: Package
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: tools/package/android.sh "$VERSION" "$BUILD"

      - name: Checksum
        working-directory: dist
        run: |
          for package in *.apk; do
            sha256sum "$package" > "$package.sha256"
            cat "$package.sha256"
          done

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: tools/package/android-smoke.sh dist/re-zoids-saga-$VERSION-android.apk dist/smoke/android-smoke.png

      - uses: actions/upload-artifact@v7
        with:
          name: package-Android
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke
          path: dist/smoke/
          if-no-files-found: ignore

  web:
    name: Package (web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: Install the WebAssembly target and wasm-bindgen
        run: |
          rustup target add wasm32-unknown-unknown
          BINDGEN=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$BINDGEN" --locked

      - name: Package
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: tools/package/web.sh "$VERSION"

      - name: Checksum
        working-directory: dist
        run: |
          for package in *-web.zip; do
            sha256sum "$package" > "$package.sha256"
            cat "$package.sha256"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: package-web
          path: |
            dist/*-web.zip
            dist/*-web.zip.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: site-web
          path: dist/web/
          if-no-files-found: error

  deploy-web:
    name: Publish the web version
    if: github.event_name == 'release'
    needs: [web]
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: site-web
          path: dist/web

      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config services/site/wrangler.jsonc

      - name: No Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::the CLOUDFLARE_API_TOKEN secret is not set, so the site was not published"

  release:
    name: Release
    if: github.event_name == 'release'
    needs: [package, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
