[package]
name = "platform-web"
description = "The platform traits in a web browser: a canvas, Web Audio, the keyboard and gamepads, and the browser's storage."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
platform.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "CanvasRenderingContext2d",
    "Document",
    "Gamepad",
    "GamepadButton",
    "HtmlCanvasElement",
    "ImageData",
    "KeyboardEvent",
    "Navigator",
    "Storage",
    "Window",
] }

[lints]
workspace = true
